- name: Milk & Cookies Recipe Website
  img: assets/images/fun/milkandcookies1.png
  width: 480
  height: 855
  gallery:
    - src: assets/images/fun/milkandcookies1.png
      width: 480
      height: 855
    - src: assets/images/fun/milkandcookies2.png
      width: 480
      height: 855
    - src: assets/images/fun/milkandcookies3.png
      width: 480
      height: 855
  desc: >
        Milk & Cookies is a recipe platform for browsing, searching, and publishing
        recipes with a clean, intuitive experience that helps cooks move faster.
        Includes ratio-aware ingredient scaling for simple resizing and supports
        both US and metric units for flexible prep and execution.
  uses: SvelteKit, PocketBase, Docker Compose, Vitest, Playwright
  link: "https://milkandcookies.win/"
- name: Recipe Scale / Conversion Library
  img: assets/images/fun/recipe-scale-conv-1.png
  width: 480
  height: 855
  gallery:
    - src: assets/images/fun/recipe-scale-conv-1.png
      width: 480
      height: 855
    - src: assets/images/fun/recipe-scale-conv-2.png
      width: 480
      height: 855
    - src: assets/images/fun/recipe-scale-conv-3.png
      width: 480
      height: 855
  desc: >
        The ingredient scaling and unit conversion library that powers Milk & Cookies, 
        built to be reusable in any JavaScript or TypeScript app. It handles fractional 
        quantities, US/metric display, ingredient-specific cup-to-gram conversions, 
        count ingredients like eggs, and configurable unit promotion/demotion.
        Available via GitHub and NPM.
  uses: JavaScript, TypeScript
  link: "https://github.com/chrisdana/recipe-scale-conv-lib"
