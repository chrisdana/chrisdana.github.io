  desc: >
        Self-hosted recipe platform for browsing, searching, and publishing
        recipes with a clean, intuitive experience that helps cooks move faster.
        Includes ratio-aware ingredient scaling for simple resizing and supports
        both US and metric units for flexible prep and execution.
  uses: SvelteKit, PocketBase, Docker Compose, Vitest, Playwright
  link: "https://milkandcookies.win/"
- name: Peg Game
  img: assets/images/projects/peg-game.png
  width: 396
  height: 484
  desc: >
        A classic brain teaser that involves arranging 15 golf tees (or pegs) 
        in an equilateral triangle on a board. One peg is then removed creating 
        an available hole. The goal is to jump over each peg with another peg, 
        removing the jumped-over peg, until only one remains. It is recreated 
        here for the Apple Watch.
  uses: Swift, SwiftUI, watchOS, XCTest, XCUITest
  link: https://github.com/chrisdana/watch-peg-game
