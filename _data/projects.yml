    - src: assets/images/fun/air-sensor-3.png
      width: 560
      height: 1116
  desc: >
        An air quality sensor built with a Raspberry Pi Zero 2W and a BME680 
        environmental sensor, with a React dashboard to display real-time and 
        historical data. The sensor agent is remotely configurable from the 
