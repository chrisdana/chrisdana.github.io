- name: Software Development
  icon: bi-code-slash
  desc: >
        Software development is being transformed by the revolution in AI coding (whether assisted, 
        agentic, or autonomous), and that shift has made speed and quality easier to achieve at the 
        same time. To turn that advantage into production-ready software, I believe it is essential 
        to apply best practices, thoughtful guardrails, and disciplined review so the final result 
        is robust, maintainable, and built to last.
- name: Firmware Development
  icon: bi-headphones
  desc: >
        Firmware development has given me a deep respect for working within tight constraints and 
        delivering reliable software close to the hardware. I value the discipline it requires, 
        from careful debugging to thoughtful optimization, and the satisfaction of seeing a system 
        behave predictably in real-world conditions.
- name: Test Automation
  icon: bi-camera2
  desc: >
        Test automation is an area I genuinely enjoy because it supports stronger software delivery 
        in a practical way. It reduces manual effort, catches regressions earlier, and provides 
        repeatable feedback that helps teams move faster without sacrificing quality.
- name: DevOps
  icon: bi-stoplights
  desc: >
        DevOps is a natural extension of that mindset, with a strong impact across the build, test, 
        and release workflow. I value the discipline required to build systems that are efficient, 
        observable, and dependable, and I take satisfaction in creating pipelines that support 
        consistent delivery at scale.
