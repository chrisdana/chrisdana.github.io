- name: Page Performance
  gallery:
    - src: assets/images/professional/proj5.png
      width: 400
      height: 420
    - src: assets/images/professional/proj5-pipeline.png
      width: 400
      height: 338
  desc: >
        I integrated SiteSpeed monitoring into a cloud-based network administration product so
        performance data became part of the standard delivery workflow. Metrics were surfaced
        through both built-in and custom workflows, with regression thresholds tuned to balance
        early detection against false positives. Alerts were routed on failure so teams could
        capture performance gains and prevent regressions from reintroducing slower page behavior.
  categories: Automation, Webpage Performance, CI, Data Science
  uses: Sitespeed.io, JS/TS, GitLab, Graphite, Grafana, OpenTelemetry, Prometheus, Pagerduty
- name: Consumer Devices
  gallery:
    - src: assets/images/professional/proj1.png
      width: 670
      height: 327
    - src: assets/images/professional/proj2.png
      width: 217
      height: 331
    - src: assets/images/professional/proj3.png
      width: 532
      height: 616
  desc: >
        Across consumer UAV, tablet, and headphone programs, I led automation efforts that improved
        validation speed, expanded test coverage, and strengthened confidence in hardware and
        firmware changes. The work ranged from hardware-in-the-loop verification for flight systems
        to Wi-Fi integration testing on tablets and long-running battery, charging, and touch-noise
        analysis on audio devices. The objective was consistent: deliver dependable coverage that
        enabled teams to move faster with clearer data and lower risk.
  categories: Automation, Firmware
  uses: C, Ruby, minitest, USB, UART, HIL, Android, ADB, Python, Selenium, Robotium, I2C, Lab Equipment
- name: Audio SDK
  img: assets/images/professional/proj4.png
  width: 652
  height: 566
  desc: >
        I led the modernization of a professional audio encoder SDK written in C/C++ that had
        become difficult to maintain because of the manual effort required to build, test, and
        release it. The effort replaced that process with a more disciplined development workflow,
        modern build tooling, and automated CI pipelines, while coordinating carefully with the
        teams that shared the codebase. The result was a simpler, faster, and more reliable
        delivery process.
  categories: Software, DevOps 
  uses: CMake, Conan, Git, GitLab, Python, Docker, VMWare, Ansible, AWS, Artifactory
